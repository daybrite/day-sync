[workspace]
resolver = "3"
members = ["crates/day-sync", "crates/day-sync-webdav", "crates/day-sync-filesystem"]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/daybrite/day-sync"
license = "MPL-2.0"
# Storage adapters inherit this default. The day-sync engine opts in to crates.io.
publish = false

[workspace.dependencies]
day-sync = { path = "crates/day-sync", version = "0.*" }
# Persistence resolves from crates.io. The transport follows the matching development API.
# `day patch --local ../day --local ../day-persistence --local ../day-webdav` builds against checkouts.
day-persistence = { version = "0.*", default-features = false, features = ["driver-rusqlite", "bundled"] }
day-webdav = { version = "0.*", git = "https://github.com/daybrite/day-webdav.git" }
day-model = "0.*"
day-reactive = "0.*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
futures-lite = "2"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }

# Lint policy for every member (each inherits it with `[lints] workspace = true`): Clippy's
# `pedantic` group, and CI treats every warning as an error. The table matches `day`'s.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"
