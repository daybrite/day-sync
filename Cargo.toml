[workspace]
resolver = "3"
members = ["crates/day-sync", "crates/day-sync-webdav", "crates/day-sync-filesystem"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/daybrite/day-sync"
license = "MPL-2.0"
# The protocol is under design review; nothing here is a release until the design settles.
publish = false

[workspace.dependencies]
day-sync = { path = "crates/day-sync", version = "0.*" }
# Persistence and the WebDAV transport resolve from crates.io.
# `day patch --local ../day --local ../day-persistence --local ../day-webdav` builds against checkouts.
day-persistence = { version = "0.*", default-features = false, features = ["driver-rusqlite", "bundled"] }
day-webdav = "0.*"
day-model = "0.*"
day-reactive = "0.*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
futures-lite = "2"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
