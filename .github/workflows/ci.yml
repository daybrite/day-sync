name: ci

# The shared Day library workflow (daybrite/actions' daylib.yml) reads what to check from this
# repository's manifests: fmt, clippy and test of the three crates on Linux, macOS and Windows,
# then the WebDAV crate again with its `reqwest` provider, and clippy for the mobile targets.
# The second set names that one crate: the provider changes nothing in the engine, and a second
# pass over the engine's suite (durable transactions, several times slower on the Windows
# runner) overran the workflow's thirty-minute test step. There is no demo app, so the demo and
# website legs are skipped, and the crate is `publish = false`, so nothing goes to crates.io.
# A push builds against the head of day's main branch and of every other Day repository's
# default branch; the nightly run builds against the newest releases.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      day-main:
        description: Build against day's main branch instead of the newest release
        type: boolean
        default: false
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: read

jobs:
  ci:
    uses: daybrite/actions/.github/workflows/daylib.yml@v1
    # The grants the shared workflow declares for its jobs. The demo and publish legs that would
    # use them are skipped here: no Day.toml, `publish = false`.
    permissions:
      contents: write
      pages: write
      id-token: write
    secrets: inherit
    with:
      day-main: ${{ inputs.day-main || false }}
      feature-sets: -p day-sync-webdav --features day-sync-webdav/reqwest
      publish: false
