<title id="title">An offline device returns after compaction</title><desc id="description">A laptop publishes a verified snapshot and removes eligible history while a phone is offline. The returning phone merges the snapshot with its unsent work and newer records.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526477"/></marker></defs>
<rect width="960" height="520" rx="16" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#182c40">
<text x="32" y="39" font-size="23" font-weight="700">An offline device returns after compaction</text>
<text x="48" y="92" font-size="19" fill="#354c61" font-weight="650" text-anchor="start">While the phone is offline</text>
<rect x="32" y="113" width="400" height="142" rx="12" fill="#edf7f1" stroke="#8bb69c" stroke-width="1.5"/>
<text x="50" y="144" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Laptop and shared storage</text>
<text x="50" y="174" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Publish and verify a snapshot.</text>
<text x="50" y="199" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Reclaim eligible older records.</text>
<text x="50" y="224" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Keep deletion information in state.</text>
<rect x="528" y="113" width="400" height="142" rx="12" fill="#edf4fc" stroke="#9bb5d3" stroke-width="1.5"/>
<text x="546" y="144" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Phone</text>
<text x="546" y="174" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Keep the local database.</text>
<text x="546" y="199" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Save an independent edit.</text>
<text x="546" y="224" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Keep its outgoing record.</text>
<text x="48" y="305" font-size="19" fill="#354c61" font-weight="650" text-anchor="start">When the phone reconnects</text>
<rect x="240" y="327" width="480" height="126" rx="12" fill="#edf7f1" stroke="#8bb69c" stroke-width="1.5"/>
<text x="258" y="358" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Merge the available state</text>
<text x="258" y="388" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Read the snapshot and newer records.</text>
<text x="258" y="413" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Preserve concurrent unsent work.</text>
<text x="258" y="438" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Publish and resolve with the same rules.</text>
<path d="M 232 257 L 232 280 L 414 280 L 414 324" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 728 257 L 728 280 L 548 280 L 548 324" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="480" y="492" font-size="17" fill="#354c61" font-weight="400" text-anchor="middle">Removed old records do not have to be replayed.</text>
</g></svg>
