<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title description">
<!-- Copyright © The Daybrite Project; SPDX-License-Identifier: MPL-2.0 -->
<title id="title">Independent edits remain candidates</title><desc id="description">A laptop and phone edit Draft while offline. Both candidate values survive delivery. A deterministic resolver chooses the display; a later edit observing both can replace them.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526477"/></marker></defs>
<rect width="960" height="570" rx="16" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#182c40">
<text x="32" y="39" font-size="23" font-weight="700">Independent edits remain candidates</text>
<rect x="320" y="74" width="320" height="88" rx="12" fill="#f3f5f7" stroke="#b1bdc8" stroke-width="1.5"/>
<text x="338" y="105" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Shared starting value</text>
<text x="338" y="135" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Title: Draft</text>
<path d="M 400 164 L 400 187 L 232 187 L 232 208" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 560 164 L 560 187 L 728 187 L 728 208" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="211" width="400" height="91" rx="12" fill="#edf4fc" stroke="#9bb5d3" stroke-width="1.5"/>
<text x="50" y="242" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Laptop, offline</text>
<text x="50" y="272" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Title: Reviewed</text>
<rect x="528" y="211" width="400" height="91" rx="12" fill="#edf4fc" stroke="#9bb5d3" stroke-width="1.5"/>
<text x="546" y="242" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Phone, offline</text>
<text x="546" y="272" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Title: Archived</text>
<path d="M 232 304 L 232 328 L 400 328 L 400 348" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 728 304 L 728 328 L 560 328 L 560 348" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="240" y="351" width="480" height="109" rx="12" fill="#edf7f1" stroke="#8bb69c" stroke-width="1.5"/>
<text x="258" y="382" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">After both edits are delivered</text>
<text x="258" y="412" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Keep Reviewed and Archived as candidates.</text>
<text x="258" y="437" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Both devices use the same display rule.</text>
<path d="M 480 462 L 480 484" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="480" y="511" font-size="17" fill="#354c61" font-weight="400" text-anchor="middle">A later edit that observes and understands both can replace them.</text>
<text x="480" y="539" font-size="17" fill="#354c61" font-weight="400" text-anchor="middle">Displaying a winner alone does not erase the other candidate.</text>
</g></svg>
