<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title description">
<!-- Copyright © The Daybrite Project; SPDX-License-Identifier: MPL-2.0 -->
<title id="title">Resume cleanup only after verification</title><desc id="description">A process stops during cleanup. On restart a missing part is repaired from the saved snapshot and the complete replacement is verified before further deletion. If verification fails, remaining inputs stay intact.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526477"/></marker></defs>
<rect width="960" height="500" rx="16" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#182c40">
<text x="32" y="39" font-size="23" font-weight="700">Resume cleanup only after verification</text>
<rect x="32" y="87" width="270" height="141" rx="12" fill="#f3f5f7" stroke="#b1bdc8" stroke-width="1.5"/>
<text x="50" y="118" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Before the interruption</text>
<text x="50" y="148" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">The snapshot was verified.</text>
<text x="50" y="173" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Some inputs were deleted.</text>
<text x="50" y="198" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">A progress cursor was saved.</text>
<rect x="345" y="87" width="270" height="141" rx="12" fill="#fff6e6" stroke="#cba258" stroke-width="1.5"/>
<text x="363" y="118" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Process restarts</text>
<text x="363" y="148" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Load the saved journal.</text>
<text x="363" y="173" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Check the replacement.</text>
<text x="363" y="198" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">A snapshot part is missing.</text>
<rect x="658" y="87" width="270" height="141" rx="12" fill="#edf4fc" stroke="#9bb5d3" stroke-width="1.5"/>
<text x="676" y="118" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Repair the saved bytes</text>
<text x="676" y="148" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Restore the missing part.</text>
<text x="676" y="173" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Read the whole snapshot.</text>
<text x="676" y="198" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Verify it before deleting.</text>
<path d="M 304 158 L 342 158" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 617 158 L 655 158" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 793 230 L 793 269" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="528" y="272" width="400" height="116" rx="12" fill="#edf7f1" stroke="#8bb69c" stroke-width="1.5"/>
<text x="546" y="303" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Verification succeeds</text>
<text x="546" y="333" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Resume from the saved cursor.</text>
<text x="546" y="358" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Newer edits remain separate.</text>
<rect x="32" y="272" width="400" height="116" rx="12" fill="#fff6e6" stroke="#cba258" stroke-width="1.5"/>
<text x="50" y="303" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Verification fails</text>
<text x="50" y="333" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Keep remaining inputs.</text>
<text x="50" y="358" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Return an error and retry later.</text>
<path d="M 658 202 L 640 202 L 640 250 L 232 250 L 232 269" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="480" y="434" font-size="17" fill="#354c61" font-weight="400" text-anchor="middle">An earlier verification receipt never substitutes for a fresh readback.</text>
<text x="480" y="464" font-size="17" fill="#354c61" font-weight="400" text-anchor="middle">A provider can still lose data after a successful read. Keep backups.</text>
</g></svg>
