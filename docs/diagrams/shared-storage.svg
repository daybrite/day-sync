<title id="title">Devices merge; storage holds files</title><desc id="description">Each device keeps a local database and exchanges records and snapshots through a shared folder or WebDAV collection.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526477"/></marker></defs>
<rect width="960" height="300" rx="16" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#182c40">
<text x="32" y="39" font-size="23" font-weight="700">Devices merge; storage holds files</text>
<rect x="32" y="110" width="240" height="125" rx="12" fill="#edf4fc" stroke="#9bb5d3" stroke-width="1.5"/>
<text x="50" y="141" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Device A</text>
<text x="50" y="171" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Local database</text>
<text x="50" y="196" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Pending edits</text>
<rect x="360" y="110" width="240" height="125" rx="12" fill="#edf7f1" stroke="#8bb69c" stroke-width="1.5"/>
<text x="378" y="141" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Shared storage</text>
<text x="378" y="171" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Records and snapshots</text>
<text x="378" y="196" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Folder or WebDAV</text>
<rect x="688" y="110" width="240" height="125" rx="12" fill="#edf4fc" stroke="#9bb5d3" stroke-width="1.5"/>
<text x="706" y="141" font-size="18" fill="#354c61" font-weight="650" text-anchor="start">Device B</text>
<text x="706" y="171" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Local database</text>
<text x="706" y="196" font-size="17" fill="#354c61" font-weight="400" text-anchor="start">Pending edits</text>
<path d="M 274 171 L 357 171" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 602 171 L 685 171" fill="none" stroke="#526477" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="480" y="85" font-size="17" fill="#354c61" font-weight="400" text-anchor="middle">A device can keep working while disconnected.</text>
<text x="480" y="273" font-size="17" fill="#354c61" font-weight="400" text-anchor="middle">The application schedules synchronization on each device.</text>
</g></svg>
