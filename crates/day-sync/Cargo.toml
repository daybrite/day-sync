[package]
name = "day-sync"
description = "Experimental replication of a Day persistence store: the engine and its store contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = ["crates-io"]
readme = "../../README.md"

[package.metadata.day]
compat = "0.*"

# The v5 replica needs the native SQLite worker. The document exchange and store
# interfaces use only std and also build for raw browser Wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { workspace = true }
day-model = { workspace = true }
day-persistence = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures-lite = { workspace = true }
day-reactive = { workspace = true }

[lints]
workspace = true
