[package]
name = "day-sync-filesystem"
description = "A directory as a day-sync store: local, on a network share, or in a folder another program synchronizes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.day]
compat = "0.6"

# Empty on the web target, like the engine it serves.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
day-sync = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures-lite = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
